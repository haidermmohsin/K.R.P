# إعدادات خط التحليل والنمذجة
project:
  name: K.R.P — CDU/VDU Iron Prediction
  unit: Unit 01

data:
  tags_file: configs/tags.yaml
  resample_freq: 1h          # معدّل التجميع الموحّد لكل السلاسل
  lab_max_staleness_h: 24    # أقصى مدة يُسمح فيها بسحب قراءة مختبرية للأمام

cleaning:
  frozen_min_repeats: 6      # عدد القراءات المتطابقة المتتالية التي تُعدّ حسّاساً مجمّداً
  outlier_sigma: 6.0         # عتبة MAD لاستبعاد القيم الشاذة
  steady_state:
    tag: crude_feed_rate
    min_fraction_of_design: 0.60
    design_value: 900        # m3/h — سعة الوحدة التصميمية
    min_hours: 6             # أقل مدة تشغيل مستقر متصلة تُقبل

features:
  lags_h: [1, 3, 6, 12, 24]
  rolling_windows_h: [6, 24, 72]
  ph_target_band: [5.5, 6.5]   # النطاق المستهدف لحموضة ماء القمة
  # هامش الحوض الساخن 01-V-003 تحت هذا الحد يعني بدء التكثّف الحمضي فيه.
  # 14°م ممارسة شائعة في المصافي؛ عايرها على بيانات وحدتك الحقيقية.
  dewpoint_margin_alarm: 14.0  # degC

model:
  target: cdu_sour_water_iron
  horizon_h: 24              # أفق التنبؤ بالساعات
  test_fraction: 0.25        # آخر 25% من الزمن للاختبار (تقسيم زمني لا عشوائي)
  n_splits: 4                # عدد طيّات التحقق الزمني المتدرج
  # أهمية التبديل: تُرشَّح الخصائص بالأهمية الداخلية ثم يُبدَّل أعلاها فقط،
  # لأن التكلفة = عدد الخصائص × عدد التكرارات تنبؤاً كاملاً. null = بلا ترشيح.
  importance_max_features: 60
  importance_n_repeats: 5
  seed: 42
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.9
    colsample_bytree: 0.8

alarm:
  iron_warning_ppm: 3.0      # حد التنبيه المبكر
  iron_critical_ppm: 5.0     # حد الإنذار الحرج
