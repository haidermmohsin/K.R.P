  # ====== قمة البرج الجوي — نظام الحوضين (Hot/Cold Drum) ======
  # تصميم الوحدة: بخار القمة يُبرَّد جزئياً في 01-E-003 ثم يدخل حوض الرجوع
  # الساخن 01-V-003 عند نحو 138°م — أي **فوق** نقطة ندى الماء عمداً، فلا
  # يتكوّن طور مائي هناك. التكثّف الأول يقع لاحقاً في 01-EA-004/01-E-020،
  # والماء الحامض يُجمع في 01-V-005. لذلك هامش نقطة الندى الحرج يُحسب عند
  # ظروف 01-V-003 لا عند قمة البرج: نزوله نحو الصفر يعني تكثّفاً حمضياً
  # مبكراً داخل الحوض الساخن وهو الحدث الخطر الأول في هذه الوحدة.
  - canonical: atm_ovhd_temp
    dcs_tag: 01TI1301
    equipment: 01-T-001
    unit: degC
    limits: [120, 200]
    source: dcs
    desc: حرارة بخار قمة البرج الجوي قبل 01-E-003 (تصميماً نحو 172°م)

  - canonical: atm_ovhd_pressure
    dcs_tag: 01PI1302
