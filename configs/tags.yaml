# ============================================================================
# خريطة وسوم DCS — وحدة 01 التقطير الجوي والفراغي (CDU/VDU)
# مشروع مصفى كربلاء — مبنية على IONE-AA01-PFD-0010-001 (4 صفحات)
# ----------------------------------------------------------------------------
# `canonical` : الاسم الموحّد داخل الكود — لا تغيّره
# `dcs_tag`   : اسم الوسم في المؤرخ (PI/PHD). **القيم أدناه مبدئية**: أرقام
#               المعدات مأخوذة من الـ PFD وهي صحيحة، أما أرقام حلقات القياس
#               فمُولَّدة على نمط الوحدة وتحتاج استبدالاً من قائمة وسوم الـ DCS.
# `equipment` : رقم المعدة في الـ PFD — مرجع للتحقق من كل وسم
# `limits`    : المدى الفيزيائي المعقول؛ خارجه يُعدّ خطأ حسّاس
# `source`    : dcs = لحظي | lab = تحليل مختبري دوري
# ============================================================================

