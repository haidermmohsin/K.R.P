  # ============ إزالة الملح — مرحلتان على التسلسل ============
  # الـ PFD يُظهر 01-V-001A ثم 01-V-001B، مع حقن مُزيل استحلاب قبل كلٍّ منهما.
  # كفاءة المرحلتين تتضاعف: 95% × 95% ≈ 99.75%، لذلك تدهور إحداهما وحدها
  # قد لا يظهر في الملح النهائي حتى تتدهور الأخرى — وهذا ما يجعل مراقبة
  # كل مرحلة على حدة أهم من مراقبة الناتج النهائي فقط.
  - canonical: desalter1_temp
    dcs_tag: 01TI1011
    equipment: 01-V-001A
    unit: degC
    limits: [80, 160]
    source: dcs
    desc: حرارة الخام عند مدخل الديسولتر الأول

