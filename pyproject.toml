[project]
name = "krp"
version = "0.1.0"
description = "تحليل ظروف وحدة CDU/VDU والتنبؤ بتآكل الحديد"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
